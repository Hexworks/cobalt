name: Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tasks: jvmTest jsNodeTest wasmJsNodeTest linuxX64Test
          - os: macos-latest
            tasks: macosArm64Test iosSimulatorArm64Test
          - os: windows-latest
            tasks: mingwX64Test
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ${{ matrix.tasks }}
